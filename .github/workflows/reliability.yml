name: Sustained reliability

on:
  schedule:
    - cron: "43 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NATSIO_RELIABILITY_CYCLES: "200"
      NATSIO_RELIABILITY_REPORT: reliability/resources.json
      PYTHONASYNCIODEBUG: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.15"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: uv sync --locked
      - run: just install-server v2.15.1
      - name: Repeated recovery and resource accounting
        run: |
          mkdir -p reliability
          set -o pipefail
          just reliability -q -s --tb=long --junitxml=reliability/junit.xml 2>&1 | tee reliability/tests.log
      - name: Retain failure and resource diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reliability-${{ github.run_id }}
          path: reliability/
          retention-days: 14
          if-no-files-found: warn
