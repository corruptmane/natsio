name: Sustained reliability

on:
  schedule:
    - cron: "43 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NATSIO_RELIABILITY_CYCLES: "200"
      NATSIO_RELIABILITY_REPORT: reliability/resources.json
      PYTHONASYNCIODEBUG: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.15"
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - run: uv sync --locked
      - run: just install-server v2.15.1
      - name: Repeated recovery and resource accounting
        run: |
          mkdir -p reliability
          set -o pipefail
          just reliability -q -s --tb=long --junitxml=reliability/junit.xml 2>&1 | tee reliability/tests.log
      - name: Retain failure and resource diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reliability-${{ github.run_id }}
          path: reliability/
          retention-days: 14
          if-no-files-found: warn
