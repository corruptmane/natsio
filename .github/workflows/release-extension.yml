# Trusted publishing: only artifacts from validation of the exact tag reach PyPI.
name: Release extension

on:
  push:
    tags: ["*/v*"]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate-release.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
